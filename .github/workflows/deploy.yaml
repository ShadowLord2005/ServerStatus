on:
  push:
    branches:
    - main
jobs:
  cd:
    name: Deploy
    uses: ShadowLord2005/MyActions/.github/workflows/tailscale_ssh_execute.yaml@main
    with:
      SSH_SCRIPT: ${{ vars.SSH_SCRIPT }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      SERVER_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
      SERVER_USER: ${{ secrets.SSS_USER }}
